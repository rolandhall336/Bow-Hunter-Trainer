<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Bow Hunter Trainer</title>

  <meta name="theme-color" content="#193b2a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bow Hunter">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>🏹 Bow Hunter Trainer</h1>
    <p>Strength • Pack Endurance • Bow Performance</p>
  </header>

  <main>

    <section id="today" class="section active">
      <div class="card">
        <h2>Today's Training</h2>
        <div id="todayWorkout"></div>
      </div>
    </section>

    <section id="week" class="section">
      <div class="card">
        <h2>Weekly Plan</h2>
        <div id="weekList"></div>
      </div>
    </section>

    <section id="progress" class="section">
      <div class="card">
        <h2>Progress</h2>
        <p class="muted">Track your workouts, body weight and personal records.</p>
        <div id="progressContent"></div>
      </div>
    </section>

    <section id="data" class="section">
      <div class="card">
        <h2>Your Data</h2>
        <p class="muted">Your training information is saved on this device.</p>
        <div id="dataContent"></div>
      </div>
    </section>

  </main>

  <nav class="nav">
    <button class="active" onclick="showSection('today', this)">
      <b>🏹</b>
      Today
    </button>

    <button onclick="showSection('week', this)">
      <b>📅</b>
      Week
    </button>

    <button onclick="showSection('progress', this)">
      <b>📈</b>
      Progress
    </button>

    <button onclick="showSection('data', this)">
      <b>⚙️</b>
      Data
    </button>
  </nav>

  <!-- Workout definitions load first -->
  <script src="workouts.js"></script>

  <!-- Main application loads second -->
  <script src="app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
</html>
